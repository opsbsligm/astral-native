# Public-source checks, real runtime compilation, SAST, dependencies and the exact SDK image.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      allow_failure: false
      # The committed lock already resolves all three manifests. Keep the real
      # scanner and SBOM coverage gate; do not run a second mutable resolution.
      disabled_resolution_jobs: "python"
      resolution_jobs_allow_failure: false
      max_scan_depth: -1
      pipcompile_lockfile_file_name_pattern: "pipcompile.lock.txt"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [test]
variables:
  AST_ENABLE_MR_PIPELINES: "true"
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  GITLAB_ADVANCED_SAST_CPP_ENABLED: "true"
default:
  tags: [native-games]
  timeout: 40 minutes

native-unit:
  needs: []
  tags: [native-games]
  image: native-games/toolchain:02b1aa2ee13b00c30b38
  before_script:
    # /opt/venv in the toolchain image is root-owned and strips the pip module, so `python3 -m pip`
    # and `ensurepip --user` both fail under CI uid 1001. Use the distro-shipped pip wheel directly:
    # pointing PYTHONPATH at the wheel puts `pip` on the import path without writing anywhere.
    # tools/extract.py needs cryptography+cffi+pycparser; the tests import installer steps that
    # import extract. capstone/lz4/unicorn already ship in /opt/venv (system site-packages).
    - export PYTHONPATH="/usr/share/python-wheels/pip-24.0-py3-none-any.whl"
    - python3 -m pip install --target "$CI_PROJECT_DIR/out/extra-pkgs" --quiet -r tools/requirements-installer.txt
    - export PYTHONPATH="/usr/share/python-wheels/pip-24.0-py3-none-any.whl:$CI_PROJECT_DIR/out/extra-pkgs"
  script:
    - python3 tools/check_content.py
    - python3 .gitlab/check_dependency_coverage.py --input-only
    - python3 tests/dependency_coverage_test.py -v
    - python3 tests/spin_waits_test.py -v
    - python3 tests/pack_shader_cache_test.py -v
    - python3 tests/package_build_test.py -v
    - python3 tests/deck_motion_test.py -v
    - python3 tests/touch_menu_test.py -v
    - python3 tests/private_package_test.py -v
    - python3 tests/deck_shortcut_test.py -v
    - python3 tests/installer_test.py -v
    - python3 tests/recovery_test.py -v
    - python3 tests/recovery_stream_test.py -v

native-build:
  needs:
    - job: native-unit
      artifacts: false
    - job: secret_detection
      artifacts: false
  tags: [native-games]
  image: native-games/toolchain:02b1aa2ee13b00c30b38
  script:
    - mkdir -p out/home
    - export DOTNET_CLI_HOME="$CI_PROJECT_DIR/out/home"
    - mkdir -p out/gen/v101 out/build
    # Layout for the runtime-library self build: one main module at the first base (mirrors the
    # VM-verified command; the SAST artifact only needs real compile commands, not a linked exe).
    - python3 -c "import sys; sys.path.insert(0,'recomp'); import layout; layout.write([('main', layout.FIRST_BASE, 0)], 'out/gen/v101', romfs_size=0, romfs_base=layout.base_of('v101'))"
    - python3 tools/build_game.py --make-runtime-lib --deps "$NATIVE_DEPS" --gen out/gen/v101 --out out/build
    - test -f out/build/libacrt.a
    # Compile the public offscreen diagnostic; physical AMD rendering is a separate Deck check.
    - |
      python3 -B - <<'PY'
      import os, subprocess, tempfile
      from pathlib import Path
      ram = os.statvfs('/dev/shm')
      assert ram.f_bavail * ram.f_frsize >= 16 * 1024 * 1024, 'UI probe RAM workspace unavailable'
      with tempfile.TemporaryDirectory(prefix='astral-touch-' + os.environ['CI_JOB_ID'] + '-', dir='/dev/shm') as scratch:
          subprocess.run(['python3', '-B', 'tools/build_touch_probe.py', '--deps', os.environ['NATIVE_DEPS'],
                          '--out', str(Path(scratch) / 'build')], check=True)
      PY
    - ninja -f out/build/build.ninja -t compdb > out/compdb.json
    - python3 .gitlab/prepare_cpp_scan.py --compdb out/compdb.json --build out/build --gen out/gen/v101 --deps "$NATIVE_DEPS" --output out/cppscan
  artifacts:
    when: always
    expire_in: 7 days
    paths: [out/cppscan.tar.gz]

container_scanning:
  tags: [native-games-origin]
  timeout: 100 minutes
  image: ${NATIVE_SECURITY_PREFIX}/container-scanning@sha256:f30b58af2ad924c82cd709b18d6594e007b492cf9e3fe6b223ff9b4d23f539e3
  allow_failure: false
  needs:
    - job: native-build
      artifacts: false
  variables:
    GIT_STRATEGY: fetch
    CS_IMAGE: "archive://out/toolchain.tar"
    CS_DISABLE_LANGUAGE_VULNERABILITY_SCAN: "false"
    CS_QUIET: "true"
    CS_TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/out/trivy-cache"
    TMPDIR: "$CI_PROJECT_DIR/out/trivy-tmp"
  before_script:
    - ruby .gitlab/fetch_toolchain.rb
    - ruby .gitlab/prepare_scanner_cache.rb
  script:
    - ruby .gitlab/run_container_scan.rb
  artifacts:
    when: always
    expire_in: 7 days
    paths: [out/container-scan.log, gl-container-scanning-report.json, gl-sbom-report.cdx.json]

dependency-scanning:
  needs:
    - job: native-build
      artifacts: false
  tags: [native-games-origin]
  variables:
    DS_ENABLE_MANIFEST_FALLBACK: "false"
  before_script:
    # Keep the unified resolution beside the manifests. The scanner's project
    # discovery otherwise treats tools/requirements.txt as an unlocked project.
    - cp .gitlab/pipcompile.lock.txt tools/pipcompile.lock.txt
    - |
      if [ -n "${NATIVE_SECURITY_API_URL:-}" ]; then
        test -s "$CI_SERVER_TLS_CA_FILE"
        export SSL_CERT_FILE="$CI_SERVER_TLS_CA_FILE"
        export CI_API_V4_URL="$NATIVE_SECURITY_API_URL"
      fi
  image: ${NATIVE_SECURITY_PREFIX}/dependency-scanning@sha256:dee4eff3ebca66a1112477142c902e62462ee53e0a8dc4292cdfa2ed459aae21

dependency-coverage:
  needs:
    - job: dependency-scanning
      artifacts: true
  image: native-games/toolchain:02b1aa2ee13b00c30b38
  script:
    - python3 .gitlab/check_dependency_coverage.py
  artifacts:
    when: always
    expire_in: 7 days
    paths: [out/dependency-coverage.json]

semgrep-sast:
  needs:
    - job: native-build
      artifacts: false
  image: ${NATIVE_SECURITY_PREFIX}/semgrep@sha256:bde285a2219a3397142bdf2e93d513b179a98ec8762208cc52242f0929abe552
  allow_failure: false

gitlab-advanced-sast:
  needs:
    - job: native-build
      artifacts: false
  image: ${NATIVE_SECURITY_PREFIX}/gitlab-advanced-sast@sha256:a4f2e8941901de686a9214ad06a781f55202b5dcdc9f2fd3274c39ba4e4491a7
  allow_failure: false

gitlab-advanced-sast-cpp:
  timeout: 90 minutes
  needs:
    - job: native-build
      artifacts: true
  variables:
    SAST_COMPILATION_DATABASE: "out/cppscan/compile_commands.json"
  before_script:
    - python3 .gitlab/unpack_cpp_scan.py
  script:
    - python3 .gitlab/run_cpp_scan.py
  artifacts:
    when: always
    paths: [out/cppscan/coverage-input.json, out/cppscan/coverage-result.json, out/cppscan/analysis.log, gl-sast-report.json]
  image: ${NATIVE_SECURITY_PREFIX}/clangsa@sha256:9aff93a28ad09aaffd1701747e350d643ce31e3f6f8a561541e6d95021fb32f3
  allow_failure: false

gitlab-advanced-sast-ext:
  needs:
    - job: native-build
      artifacts: false
  image: ${NATIVE_SECURITY_PREFIX}/gitlab-advanced-sast-ext@sha256:046eb419b1e2acb992013c649cd8932ff05dfa14f8c35335a96201f1f7522f64
  allow_failure: false

secret_detection:
  image: ${NATIVE_SECURITY_PREFIX}/secrets@sha256:05e8567c4e4bdfaec379c3c2f867204b32b0226636b5380642d8d4f87a66ad93
  allow_failure: false

# ── GitHub 镜像（展示仓单向同步：GitLab 源 → opsbsligm/$CI_PROJECT_NAME）──
# 只读 deploy key 直推，known_hosts 取 GitHub 官方 /meta 固定指纹。
# 项目级 CI 变量：GITHUB_DEPLOY_KEY(file)、GITHUB_SSH_KNOWN_HOSTS(env_var)。
mirror-github:
  stage: test
  tags: [macos]
  needs: []
  timeout: 5m
  resource_group: github-mirror
  variables:
    GIT_CONFIG_GLOBAL: /dev/null
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - echo "$GITHUB_SSH_KNOWN_HOSTS" > "$CI_PROJECT_DIR/.github_known_hosts"
    - printf '%s' "$GITHUB_DEPLOY_KEY_B64" | base64 -d > "$CI_PROJECT_DIR/GITHUB_DEPLOY_KEY"
    - chmod 600 "$CI_PROJECT_DIR/GITHUB_DEPLOY_KEY"
    - test -s "$CI_PROJECT_DIR/GITHUB_DEPLOY_KEY"
    - export GIT_SSH_COMMAND="ssh -F /dev/null -i $CI_PROJECT_DIR/GITHUB_DEPLOY_KEY -o UserKnownHostsFile=$CI_PROJECT_DIR/.github_known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o AddressFamily=inet -o ConnectTimeout=12"
    - git push --force-with-lease "ssh://git@ssh.github.com:443/opsbsligm/$CI_PROJECT_NAME.git" "$CI_COMMIT_SHA:refs/heads/main"
    - git push "ssh://git@ssh.github.com:443/opsbsligm/$CI_PROJECT_NAME.git" --tags
  after_script:
    - rm -f "$CI_PROJECT_DIR/GITHUB_DEPLOY_KEY" "$CI_PROJECT_DIR/.github_known_hosts"
