# astral-native CI（对齐 totk/botw 门禁：内容守卫 + 纯 Python 单元 + 密钥扫描 + runtime 构建 + SAST 链）。
# container_scanning 与 dependency-scanning 需要本项目登记 toolchain 通用包与 pip 依赖锁，见 docs/ci-roadmap.md，下一 MR 接入。
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [test]
variables:
  AST_ENABLE_MR_PIPELINES: "true"
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  GITLAB_ADVANCED_SAST_CPP_ENABLED: "true"
default:
  tags: [native-games]
  timeout: 40 minutes

native-unit:
  needs: []
  tags: [native-games]
  image: native-games/toolchain:02b1aa2ee13b00c30b38
  before_script:
    # /opt/venv in the toolchain image is root-owned and strips the pip module, so `python3 -m pip`
    # and `ensurepip --user` both fail under CI uid 1001. Use the distro-shipped pip wheel directly:
    # pointing PYTHONPATH at the wheel puts `pip` on the import path without writing anywhere.
    # tools/extract.py needs cryptography+cffi+pycparser; the tests import installer steps that
    # import extract. capstone/lz4/unicorn already ship in /opt/venv (system site-packages).
    - export PYTHONPATH="/usr/share/python-wheels/pip-24.0-py3-none-any.whl"
    - python3 -m pip install --target "$CI_PROJECT_DIR/out/extra-pkgs" --quiet -r tools/requirements-installer.txt
    - export PYTHONPATH="/usr/share/python-wheels/pip-24.0-py3-none-any.whl:$CI_PROJECT_DIR/out/extra-pkgs"
  script:
    - python3 tools/check_content.py
    - python3 tests/spin_waits_test.py -v
    - python3 tests/pack_shader_cache_test.py -v
    - python3 tests/package_build_test.py -v
    - python3 tests/installer_test.py -v

native-build:
  needs:
    - job: native-unit
      artifacts: false
    - job: secret_detection
      artifacts: false
  tags: [native-games]
  image: native-games/toolchain:02b1aa2ee13b00c30b38
  script:
    - mkdir -p out/home
    - export HOME="$CI_PROJECT_DIR/out/home"
    - mkdir -p out/gen/v101 out/build
    # Layout for the runtime-library self build: one main module at the first base (mirrors the
    # VM-verified command; the SAST artifact only needs real compile commands, not a linked exe).
    - python3 -c "import sys; sys.path.insert(0,'recomp'); import layout; layout.write([('main', layout.FIRST_BASE, 0)], 'out/gen/v101', romfs_size=0, romfs_base=layout.base_of('v101'))"
    - python3 tools/build_game.py --make-runtime-lib --deps "$NATIVE_DEPS" --gen out/gen/v101 --out out/build
    - test -f out/build/libacrt.a
    - ninja -f out/build/build.ninja -t compdb > out/compdb.json
    - python3 .gitlab/prepare_cpp_scan.py --compdb out/compdb.json --build out/build --gen out/gen/v101 --deps "$NATIVE_DEPS" --output out/cppscan
  artifacts:
    when: always
    expire_in: 7 days
    paths: [out/cppscan.tar.gz]

semgrep-sast:
  needs:
    - job: native-build
      artifacts: false
  image: ${NATIVE_SECURITY_PREFIX}/semgrep@sha256:bde285a2219a3397142bdf2e93d513b179a98ec8762208cc52242f0929abe552
  allow_failure: false

gitlab-advanced-sast:
  needs:
    - job: native-build
      artifacts: false
  image: ${NATIVE_SECURITY_PREFIX}/gitlab-advanced-sast@sha256:a4f2e8941901de686a9214ad06a781f55202b5dcdc9f2fd3274c39ba4e4491a7
  allow_failure: false

gitlab-advanced-sast-cpp:
  timeout: 90 minutes
  needs:
    - job: native-build
      artifacts: true
  variables:
    SAST_COMPILATION_DATABASE: "out/cppscan/compile_commands.json"
  before_script:
    - python3 .gitlab/unpack_cpp_scan.py
  script:
    - python3 .gitlab/run_cpp_scan.py
  artifacts:
    when: always
    paths: [out/cppscan/coverage-input.json, out/cppscan/coverage-result.json, out/cppscan/analysis.log, gl-sast-report.json]
  image: ${NATIVE_SECURITY_PREFIX}/clangsa@sha256:9aff93a28ad09aaffd1701747e350d643ce31e3f6f8a561541e6d95021fb32f3
  allow_failure: false

gitlab-advanced-sast-ext:
  needs:
    - job: native-build
      artifacts: false
  image: ${NATIVE_SECURITY_PREFIX}/gitlab-advanced-sast-ext@sha256:046eb419b1e2acb992013c649cd8932ff05dfa14f8c35335a96201f1f7522f64
  allow_failure: false

secret_detection:
  image: ${NATIVE_SECURITY_PREFIX}/secrets@sha256:05e8567c4e4bdfaec379c3c2f867204b32b0226636b5380642d8d4f87a66ad93
  allow_failure: false
